name: Category Package CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - "main"
      - "codex/phase-*-draft"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: category-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CATEGORY_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=category_ci;charset=utf8mb4
  CATEGORY_TEST_DB_USER: category_test
  CATEGORY_TEST_DB_PASSWORD: category_test

jobs:
  category-latest:
    name: Category latest dependencies (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    services:
      mysql:
        image: mysql:8.0.16
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: category_ci
          MYSQL_USER: category_test
          MYSQL_PASSWORD: category_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Enable MySQL trigger creation
        run: |
          set -euo pipefail
          mysql_container="$(docker ps --filter ancestor=mysql:8.0.16 --format '{{.ID}}' | head -n 1)"
          test -n "$mysql_container"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Resolve latest compatible dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: MySQL Integration tests
        run: composer test:integration

      - name: Full Category suite
        run: composer test

  category-lowest:
    name: Category lowest dependencies (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0.16
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: category_ci
          MYSQL_USER: category_test
          MYSQL_PASSWORD: category_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Enable MySQL trigger creation
        run: |
          set -euo pipefail
          mysql_container="$(docker ps --filter ancestor=mysql:8.0.16 --format '{{.ID}}' | head -n 1)"
          test -n "$mysql_container"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHP syntax
        run: find src tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Resolve lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress

      - name: Validate optimized PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --no-interaction --abandoned=fail

      - name: PHPStan level max
        run: composer analyse

      - name: Unit tests
        run: composer test:unit

      - name: MySQL Integration tests
        run: composer test:integration

      - name: Full Category suite
        run: composer test

  standalone-consumer:
    name: Standalone external Composer consumer (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0.16
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: category_standalone
          MYSQL_USER: category_test
          MYSQL_PASSWORD: category_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      CATEGORY_STANDALONE_DSN: mysql:host=127.0.0.1;port=3306;dbname=category_standalone;charset=utf8mb4
      CATEGORY_STANDALONE_DB_USER: category_test
      CATEGORY_STANDALONE_DB_PASSWORD: category_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, pdo_mysql
          tools: composer
          coverage: none

      - name: Enable MySQL trigger creation
        run: |
          set -euo pipefail
          mysql_container="$(docker ps --filter ancestor=mysql:8.0.16 --format '{{.ID}}' | head -n 1)"
          test -n "$mysql_container"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"

      - name: Reject host-coupled runtime declarations
        run: |
          set -euo pipefail
          if jq -r '.require | keys[]' composer.json | grep -E -i 'adminkernel|admin-control-panel|catalog|slim|php-di'; then
            echo "A forbidden host/runtime Composer dependency is declared."
            exit 1
          fi
          if grep -R -E -n -i 'adminkernel|admin-control-panel|(^|[^[:alnum:]_])catalog([^[:alnum:]_]|$)|(^|[^[:alnum:]_])slim([^[:alnum:]_]|$)|php-di' composer.json src; then
            echo "A forbidden host/runtime symbol is referenced by the package."
            exit 1
          fi
          if grep -R -E -n '^(namespace|use)[[:space:]]+(App|Host|Admin|Catalog|Slim|DI)(\\|[[:space:]]|;)' src; then
            echo "A forbidden host namespace is referenced by package runtime code."
            exit 1
          fi
          if grep -R -E -n '(^|[^[:alnum:]_])(require|require_once|include|include_once)([^[:alnum:]_]|$)' src; then
            echo "Package runtime code includes a host-owned file."
            exit 1
          fi
          if grep -R -E -n -i 'CREATE TABLE.*(admin|catalog|host)|REFERENCES.*(admin|catalog|host)' schema; then
            echo "The package schema references a forbidden host-owned table."
            exit 1
          fi

      - name: Create clean external consumer and local VCS source
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          echo "CATEGORY_CONSUMER_DIR=$consumer_dir" >> "$GITHUB_ENV"
          vcs_dir="$RUNNER_TEMP/category-vcs.git"
          source_branch="${GITHUB_HEAD_REF:-main}"
          source_sha="$(git rev-parse HEAD)"
          git clone --bare "$GITHUB_WORKSPACE" "$vcs_dir"
          git --git-dir="$vcs_dir" update-ref "refs/heads/$source_branch" "$source_sha"
          cp tests/StandaloneConsumer/composer.json "$consumer_dir/composer.json"
          cp tests/StandaloneConsumer/consumer.php "$consumer_dir/consumer.php"
          composer config repositories.category vcs "$vcs_dir" --working-dir="$consumer_dir"
          composer require --no-interaction --prefer-dist --no-progress --working-dir="$consumer_dir" "maatify/php-category:dev-$source_branch"
          composer validate --strict --working-dir="$consumer_dir"
          composer install --no-interaction --prefer-dist --no-progress --working-dir="$consumer_dir"
          composer dump-autoload --optimize --strict-psr --working-dir="$consumer_dir"
          composer check-platform-reqs --working-dir="$consumer_dir"
          composer audit --no-interaction --abandoned=fail --working-dir="$consumer_dir"
          jq -e '.packages[] | select(.name == "maatify/php-category" and .source.type == "git")' "$consumer_dir/composer.lock"
          if composer show --tree --working-dir="$consumer_dir" | grep -E -i '(^|[^[:alnum:]_])(adminkernel|admin-control-panel|catalog|slim|php-di)([^[:alnum:]_]|$)'; then
            echo "The clean consumer resolved a forbidden host dependency."
            exit 1
          fi
          (cd "$consumer_dir" && php consumer.php)

      - name: Verify the clean consumer has no host files
        run: |
          set -euo pipefail
          for expected_file in composer.json composer.lock consumer.php vendor; do
            test -e "$CATEGORY_CONSUMER_DIR/$expected_file"
          done
          unexpected_file="$(find "$CATEGORY_CONSUMER_DIR" -mindepth 1 -maxdepth 1 ! -name composer.json ! -name composer.lock ! -name consumer.php ! -name vendor -print -quit)"
          if [ -n "$unexpected_file" ]; then
            echo "The clean consumer contains an unexpected host file: $unexpected_file"
            exit 1
          fi
          host_file="$(find "$CATEGORY_CONSUMER_DIR" -maxdepth 1 -type f \( -name '*Host*' -o -name '*Admin*' -o -name '*Catalog*' \) -print -quit)"
          if [ -n "$host_file" ]; then
            echo "The clean consumer contains a host-owned file: $host_file"
            exit 1
          fi

  workflow-lint:
    name: Workflow syntax lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  whitespace-check:
    name: Package whitespace verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check package-owned committed whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi
          git diff --check "$BASE_SHA...$HEAD_SHA" -- . ':(exclude)docs/php-engineering-standards/**'

  category-quality-gate:
    name: Category Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [category-latest, category-lowest, standalone-consumer, workflow-lint, whitespace-check]
    if: always()

    steps:
      - name: Check Category required jobs
        run: |
          set -euo pipefail
          if [ "${{ needs.category-latest.result }}" != "success" ]; then
            echo "category-latest: ${{ needs.category-latest.result }}"
            exit 1
          fi
          if [ "${{ needs.category-lowest.result }}" != "success" ]; then
            echo "category-lowest: ${{ needs.category-lowest.result }}"
            exit 1
          fi
          if [ "${{ needs.standalone-consumer.result }}" != "success" ]; then
            echo "standalone-consumer: ${{ needs.standalone-consumer.result }}"
            exit 1
          fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "workflow-lint: ${{ needs.workflow-lint.result }}"
            exit 1
          fi
          if [ "${{ needs.whitespace-check.result }}" != "success" ]; then
            echo "whitespace-check: ${{ needs.whitespace-check.result }}"
            exit 1
          fi
          echo "All Category CI jobs passed."
